name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node --check public/app.js
      - run: node --check security.js
      - name: Check Arena browser modules
        run: for file in public/hub/shared/*.js public/arena-navigation.js; do node --check "$file"; done

